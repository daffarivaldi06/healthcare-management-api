services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare-management-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_management
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: healthcare-management-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/healthcare_management?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_EXPIRES_IN: 1d
      BCRYPT_SALT_ROUNDS: 10
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"

volumes:
  postgres-data:
